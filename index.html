function showMicrophonePermissionHelp(permissionError) {
  console.warn("[VoiceCheck] Microphone permission problem:", permissionError);
  const isIos = /iPad|iPhone|iPod/.test(navigator.userAgent);
  openModal(
    '<h3 class="sub-heading" style="padding-right:40px">🎙️ I can\'t hear you yet</h3>' +
    '<p class="body-text" style="margin-bottom:12px">Your browser blocked the microphone. To fix it:</p>' +
    (isIos
      ? '<ol class="body-text" style="padding-left:20px;line-height:1.9"><li>Tap <strong>aA</strong> (or the lock) in Safari\'s address bar.</li><li>Tap <strong>Website Settings → Microphone → Allow</strong>.</li><li>Reload this page.</li></ol>'
      : '<ol class="body-text" style="padding-left:20px;line-height:1.9"><li>Click the <strong>lock / settings icon</strong> next to the web address.</li><li>Set <strong>Microphone</strong> to <strong>Allow</strong>.</li><li>Reload this page.</li></ol>') +
    '<p class="small-text" style="margin-top:12px">Using a school iPad or laptop? The microphone may be switched off by the school — try a home device.</p>' +
    '<div class="button-row" style="justify-content:flex-end;margin-top:20px"><button class="btn btn-primary btn-sm" onclick="location.reload()">Reload page</button></div>',
    { small: true }
  );
}

function renderPromptProgressDots() {
  const prompts = appState.invite.prompts || [];
  if (prompts.length < 2) return "";
  return '<div class="prompt-progress no-print">' + prompts.map((promptDefinition, index) => {
    const answer = getPromptAnswer(promptDefinition);
    const className = answer && answer.final ? "done" : (index === appState.studentPromptIndex ? "current" : "");
    return '<span class="' + className + '"></span>';
  }).join("") + '</div>';
}

function renderStudentPromptScreen() {
  const invite = appState.invite;
  const promptDefinition = invite.prompts[appState.studentPromptIndex];
  const answer = getPromptAnswer(promptDefinition);
  const isFollowUpPhase = Boolean(answer && answer.status === "awaiting_follow_up" && answer.firstPass && answer.firstPass.followUpQuestion);
  appState.studentRecordingPhase = isFollowUpPhase ? "followUp" : "main";
  appState.recordedAudio = null;

  const maximumSeconds = isFollowUpPhase ? Math.min(90, invite.maxRecordingSeconds) : invite.maxRecordingSeconds;
  const questionText = isFollowUpPhase ? answer.firstPass.followUpQuestion : promptDefinition.question;

  appRoot.innerHTML =
    '<div class="page-container narrow">' +
      renderPromptProgressDots() +
      '<div class="question-card">' +
        (isFollowUpPhase ? '<div class="follow-up-banner">🔎 Follow-up question</div>' : '') +
        '<div class="question-counter">' + (invite.prompts.length > 1 ? "Question " + (appState.studentPromptIndex + 1) + " of " + invite.prompts.length : escapeHtml(invite.topic)) + '</div>' +
        '<div class="question-text">' + escapeHtml(questionText) + '</div>' +
        '<div class="question-hint">' + (isFollowUpPhase
          ? "Nice start! Answer this one so I can see how deep your understanding goes."
          : "Tap the microphone and explain in your own words. Say <em>why</em>, and give examples.") + '</div>' +
      '</div>' +

      '<div class="mic-stage" id="micStage">' +
        '<div class="mic-orb-wrapper">' +
          '<div class="mic-level-ring outer" id="micLevelRingOuter"></div>' +
          '<div class="mic-level-ring" id="micLevelRingInner"></div>' +
          '<button class="mic-button" id="micButton" aria-label="Start recording">' +
            '<svg viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10v1a7 7 0 0014 0v-1"/><path d="M12 18v4"/><path d="M8 22h8"/></svg>' +
            '<span class="stop-square"></span>' +
          '</button>' +
        '</div>' +
        '<div class="mic-timer"><span id="micTimerValue">0:00</span> <span class="timer-max">/ ' + formatSeconds(maximumSeconds) + '</span></div>' +
        '<div class="time-progress"><div class="time-progress-fill" id="timeProgressFill"></div></div>' +
        '<div class="mic-status-text" id="micStatusText">Tap the microphone to start talking.</div>' +
      '</div>' +

      '<div id="reviewArea"></div>' +
    '</div>';

  wireMicrophoneButton(maximumSeconds);
}

function wireMicrophoneButton(maximumSeconds) {
  const micButton = document.getElementById("micButton");
  const micStage = document.getElementById("micStage");
  const statusText = document.getElementById("micStatusText");
  const timerValue = document.getElementById("micTimerValue");
  const progressFill = document.getElementById("timeProgressFill");
  const innerRing = document.getElementById("micLevelRingInner");
  const outerRing = document.getElementById("micLevelRingOuter");
  let isRecording = false;
  let isBusy = false;

  async function stopAndReview() {
    if (!isRecording) return;
    isRecording = false;
    isBusy = true;
    micStage.classList.remove("is-recording");
    micButton.setAttribute("aria-label", "Start recording");
    statusText.textContent = "Saving your recording…";
    try {
      const recordedAudio = await stopVoiceRecording();
      appState.recordedAudio = recordedAudio;
      innerRing.style.transform = "scale(1)";
      outerRing.style.transform = "scale(1)";
      renderRecordingReview();
      statusText.textContent = "Listen back, then submit — or tap the microphone to record again.";
    } catch (stopError) {
      console.error("[VoiceCheck] Stop failed:", stopError);
      statusText.textContent = "Something went wrong saving the recording. Please try again.";
    }
    isBusy = false;
  }

  micButton.addEventListener("click", async () => {
    if (isBusy) return;
    if (isRecording) { await stopAndReview(); return; }

    // Starting a new recording discards the previous unsent one.
    if (appState.recordedAudio && appState.recordedAudio.objectUrl) URL.revokeObjectURL(appState.recordedAudio.objectUrl);
    appState.recordedAudio = null;
    document.getElementById("reviewArea").innerHTML = "";

    isBusy = true;
    statusText.textContent = "Starting the microphone…";
    try {
      await startVoiceRecording({
        maximumSeconds,
        onLevel: level => {
          innerRing.style.transform = "scale(" + (1 + level * 0.55).toFixed(3) + ")";
          outerRing.style.transform = "scale(" + (1 + level * 0.95).toFixed(3) + ")";
        },
        onTick: elapsedSeconds => {
          timerValue.textContent = formatSeconds(elapsedSeconds);
          progressFill.style.width = Math.min(100, (elapsedSeconds / maximumSeconds) * 100) + "%";
          const remaining = maximumSeconds - elapsedSeconds;
          if (remaining <= 15 && remaining > 0) statusText.textContent = "⏳ " + Math.ceil(remaining) + " seconds left — start wrapping up!";
        },
        onAutoStop: () => {
          stopAndReview();
          showToast("Time's up — your recording was saved.", "info");
        }
      });
      isRecording = true;
      micStage.classList.add("is-recording");
      micButton.setAttribute("aria-label", "Stop recording");
      statusText.textContent = "🔴 Recording… tap the square when you're done.";
    } catch (startError) {
      console.error("[VoiceCheck] Could not start recording:", startError);
      statusText.textContent = startError.message && startError.message.length < 160 && !/Permission|NotAllowed/i.test(startError.name + startError.message)
        ? startError.message
        : "The microphone is blocked.";
      if (/NotAllowed|Permission|denied/i.test(String(startError.name) + String(startError.message))) showMicrophonePermissionHelp(startError);
    }
    isBusy = false;
  });

  // If the student leaves the page mid-recording, release the microphone.
  window.addEventListener("pagehide", cancelVoiceRecording, { once: true });
}

function renderRecordingReview() {
  const recordedAudio = appState.recordedAudio;
  const reviewArea = document.getElementById("reviewArea");
  const tooShort = recordedAudio.durationSeconds < MINIMUM_RECORDING_SECONDS;
  const probablySilent = recordedAudio.peakLevel > 0 && recordedAudio.peakLevel < SILENCE_PEAK_THRESHOLD;

  reviewArea.innerHTML =
    '<div class="recording-review" style="margin:0 auto">' +
      '<p class="label-text" style="margin-bottom:8px">Your recording · <span class="numeric">' + formatSeconds(recordedAudio.durationSeconds) + '</span></p>' +
      '<audio controls src="' + recordedAudio.objectUrl + '"></audio>' +
      (tooShort ? '<div class="notice warn">That was very short. Try explaining a bit more before you submit.</div>' : '') +
      (!tooShort && probablySilent ? '<div class="notice warn">I could barely hear anything. Play it back — if it\'s quiet, move closer and record again.</div>' : '') +
      '<div class="button-row centered">' +
        '<button class="btn btn-primary btn-submit" id="submitRecordingButton" ' + (tooShort ? "disabled" : "") + '>✓ Submit my answer</button>' +
      '</div>' +
      '<p class="small-text" style="text-align:center;margin-top:10px">Want to redo it? Just tap the microphone again.</p>' +
    '</div>';

  document.getElementById("submitRecordingButton").addEventListener("click", submitStudentRecording);
}

function setThinkingStep(activeIndex) {
  document.querySelectorAll("#thinkingSteps li").forEach(item => {
    const stepIndex = Number(item.dataset.step);
    item.classList.toggle("done", stepIndex < activeIndex);
    item.classList.toggle("active", stepIndex === activeIndex);

function renderSubmitFailure(message) {
  appRoot.innerHTML =

        '<div style="font-size:2.2rem;margin-bottom:10px">😕</div>' +

          '<button class="btn btn-ghost" id="recordAgainButton">Record again instead</button>' +

/* ---------- Submit → upload → Gemini → save ---------- */
async function submitStudentRecording() {
  const invite = appState.invite;
  const promptDefinition = invite.prompts[appState.studentPromptIndex];
  const recordedAudio = appState.recordedAudio;
  const phase = appState.studentRecordingPhase;
  if (!recordedAudio) return;

  renderThinkingPanel(phase === "followUp" ? "Putting both answers together…" : "Listening carefully to your answer…");
  setThinkingStep(0);

  try {
    // Upload (for the teacher) and prepare WAV (for Gemini) in parallel.
    const [uploadResult, geminiAudio] = await Promise.all([
      recordedAudio.uploadResult ? Promise.resolve(recordedAudio.uploadResult) : uploadRecordingToStorage(invite.token, promptDefinition.id, phase, recordedAudio),
      recordedAudio.geminiAudio ? Promise.resolve(recordedAudio.geminiAudio) : prepareAudioForGemini(recordedAudio)
    ]);
    recordedAudio.uploadResult = uploadResult;     // cached so "Try again" doesn't re-upload
    recordedAudio.geminiAudio = geminiAudio;

    setThinkingStep(1);
    const assignmentContext = { subject: invite.subject, level: invite.level, topic: invite.topic };
    const existingAnswer = getPromptAnswer(promptDefinition);

    let rawJudgement;
    const stepTimer = setTimeout(() => setThinkingStep(2), 5000);
    const stepTimerTwo = setTimeout(() => setThinkingStep(3), 12000);
    try {
      if (phase === "followUp") {
        rawJudgement = await askGeminiJsonWithAudio(
          buildFinalPassPrompt(assignmentContext, promptDefinition, existingAnswer.firstPass, existingAnswer.firstPass.followUpQuestion),
          geminiAudio.base64, geminiAudio.mimeType
        );
      } else {
        rawJudgement = await askGeminiJsonWithAudio(
          buildFirstPassPrompt(assignmentContext, promptDefinition),
          geminiAudio.base64, geminiAudio.mimeType
        );
      }
    } finally {
      clearTimeout(stepTimer);
      clearTimeout(stepTimerTwo);
    }
    setThinkingStep(3);

    const judgement = normaliseJudgement(rawJudgement, promptDefinition);
    const audioRecord = {
      audioUrl: uploadResult.downloadUrl,
      audioPath: uploadResult.storagePath,
      durationSeconds: recordedAudio.durationSeconds,
      mimeType: recordedAudio.mimeType,
      recordedAt: new Date().toISOString()
    };

    // Couldn't hear the student → ask them to record again; this does not use up an attempt.
    if (judgement.audioQuality === "silent" || judgement.audioQuality === "unclear") {
      await sleep(400);
      renderStudentPromptScreen();
      openModal(
        '<h3 class="sub-heading" style="padding-right:40px">🎧 I couldn\'t hear you clearly</h3>' +
        '<p class="body-text">Move somewhere quieter, hold the device closer, and speak a little louder. Then record again — this try did not count.</p>' +
        '<div class="button-row" style="justify-content:flex-end;margin-top:20px"><button class="btn btn-primary btn-sm" id="okayRecordAgainButton">Okay</button></div>',
        { small: true }
      );
      document.getElementById("okayRecordAgainButton").addEventListener("click", closeModal);
      return;
    }

    let updatedAnswer;
    if (phase === "main") {
      const previousAttempts = existingAnswer && existingAnswer.final
        ? [...(existingAnswer.previousAttempts || []), summariseAttemptForHistory(existingAnswer)]
        : (existingAnswer && existingAnswer.previousAttempts) || [];
      const attemptNumber = previousAttempts.length + 1;
      const wantsFollowUp = Boolean(invite.followUpEnabled && judgement.followUpQuestion);

      updatedAnswer = {
        promptId: promptDefinition.id,
        attemptNumber,
        previousAttempts,
        main: { ...audioRecord, transcript: judgement.transcript },
        firstPass: judgement,
        followUp: null,
        final: wantsFollowUp ? null : { ...judgement, followUpTranscript: "" },
        status: wantsFollowUp ? "awaiting_follow_up" : "complete",
        teacherOverride: null
      };
    } else {
      const finalJudgement = { ...judgement };
      finalJudgement.followUpTranscript = judgement.transcript;
      finalJudgement.transcript = existingAnswer.firstPass.transcript;
      finalJudgement.followUpQuestion = "";
      updatedAnswer = {
        ...existingAnswer,
        followUp: { ...audioRecord, question: existingAnswer.firstPass.followUpQuestion, transcript: judgement.transcript },
        final: finalJudgement,
        status: "complete"
      };
    }

    invite.answers = { ...(invite.answers || {}), [promptDefinition.id]: updatedAnswer };
    const allComplete = findFirstUnfinishedPromptIndex(invite) === -1;
    const firestoreUpdate = {
      ["answers." + promptDefinition.id]: updatedAnswer,
      status: allComplete ? "completed" : "in_progress",
      lastActivityAt: serverTimestamp(),
      currentPromptIndex: appState.studentPromptIndex
    };
    const wasAlreadyCompleted = Boolean(invite.completedAt);
    if (allComplete) {
      invite.overall = computeOverallResult(invite);
      firestoreUpdate.overall = invite.overall;
      firestoreUpdate.completedAt = serverTimestamp();
      invite.status = "completed";
      invite.completedAt = new Date();
    } else {
      invite.status = "in_progress";
    }
    await updateDoc(doc(firestore, COLLECTION_INVITES, invite.token), firestoreUpdate);

    if (allComplete && !wasAlreadyCompleted && invite.notifyAdminOnComplete) {
      queueEmail(ADMIN_EMAIL, buildAdminCompletionEmail(invite, invite.overall)).catch(mailError =>
        console.warn("[VoiceCheck] Admin notification not queued:", mailError));
    }

    if (appState.recordedAudio && appState.recordedAudio.objectUrl) URL.revokeObjectURL(appState.recordedAudio.objectUrl);
    appState.recordedAudio = null;

    if (updatedAnswer.status === "awaiting_follow_up") {
      renderFollowUpTransition(updatedAnswer);
    } else {
      renderStudentPromptResult(promptDefinition, updatedAnswer, true);
    }
  } catch (submitError) {
    console.error("[VoiceCheck] Submit failed:", submitError);
    renderSubmitFailure(describeGeminiError(submitError));
  }
}

function summariseAttemptForHistory(answer) {
  return {
    attemptNumber: answer.attemptNumber || 1,
    mainAudioUrl: answer.main ? answer.main.audioUrl : "",
    followUpAudioUrl: answer.followUp ? answer.followUp.audioUrl : "",
    mainTranscript: answer.main ? answer.main.transcript : "",
    followUpQuestion: answer.followUp ? answer.followUp.question : "",
    followUpTranscript: answer.followUp ? answer.followUp.transcript : "",
    understandingLevel: answer.final ? answer.final.understandingLevel : null,
    coveragePercent: answer.final ? answer.final.coveragePercent : null,
    judgedAt: answer.final ? answer.final.judgedAt : ""
  };
}

function renderFollowUpTransition(answer) {
  const explainedCount = answer.firstPass.conceptCoverage.filter(item => item.status === "explained").length;
  const mentionedCount = answer.firstPass.conceptCoverage.filter(item => item.status === "mentioned").length;
  appRoot.innerHTML =
    '<div class="page-container narrow">' +
      renderPromptProgressDots() +
      '<div class="result-hero">' +
        '<div class="feedback-icon growing" id="transitionIcon"><svg viewBox="0 0 24 24"><path class="draw-path" d="M4 12l5 5L20 7"/></svg></div>' +
        '<h2 class="section-heading">Got it — thanks!</h2>' +
        '<p class="body-text">I heard you explain <strong>' + explainedCount + '</strong> key idea' + (explainedCount === 1 ? "" : "s") +
          (mentionedCount ? ' and mention <strong>' + mentionedCount + '</strong> more' : '') + '.</p>' +
        '<p class="body-text" style="margin-top:10px">Before I give you feedback, I have <strong>one follow-up question</strong>.</p>' +
        '<div class="button-row centered" style="margin-top:22px">' +
          '<button class="btn btn-primary btn-lg" id="goToFollowUpButton">🔎 Show me the question</button>' +
        '</div>' +
      '</div>' +
    '</div>';
  requestAnimationFrame(() => document.getElementById("transitionIcon").classList.add("visible"));
  document.getElementById("goToFollowUpButton").addEventListener("click", renderStudentPromptScreen);
}

/* ---------- Result rendering (shared by student screen + admin detail) ---------- */
function renderConceptCoverageListHtml(final, options = {}) {
  return '<ul class="concept-list">' + (final.conceptCoverage || []).map((item, index) => {
    const statusInfo = CONCEPT_STATUS[item.status] || CONCEPT_STATUS.missing;
    return '<li class="concept-item status-' + item.status + '" style="animation-delay:' + (index * 0.07) + 's">' +
      '<div class="concept-status-icon">' + statusInfo.icon + '</div>' +
      '<div>' +
        '<div class="concept-name">' + escapeHtml(item.conceptName) + '</div>' +
        '<div class="concept-status-label">' + escapeHtml(statusInfo.label) + '</div>' +
        (item.evidence ? '<div class="concept-evidence">“' + escapeHtml(item.evidence) + '”</div>' : '') +
        (options.showTeacherComments && item.comment ? '<div class="concept-comment">' + escapeHtml(item.comment) + '</div>' : '') +
      '</div>' +
    '</li>';
  }).join("") + '</ul>';
}

function renderStrengthsAndStepsHtml(final) {
  const strengthsHtml = final.strengths.length
    ? '<div class="mini-list-card strengths"><h4>🌟 What you did well</h4><ul>' + final.strengths.map(item => '<li>' + escapeHtml(item) + '</li>').join("") + '</ul></div>'
    : "";
  const stepsHtml = final.nextSteps.length
    ? '<div class="mini-list-card next-steps"><h4>🎯 Next steps</h4><ul>' + final.nextSteps.map(item => '<li>' + escapeHtml(item) + '</li>').join("") + '</ul></div>'
    : "";
  const misconceptionsHtml = final.misconceptions.length
    ? '<div class="mini-list-card misconceptions" style="grid-column:1/-1"><h4>🔧 Ideas to fix</h4><ul>' +
        final.misconceptions.map(item => '<li>' + (item.studentSaid ? 'You said “' + escapeHtml(item.studentSaid) + '”. ' : '') + '<strong>' + escapeHtml(item.correction) + '</strong></li>').join("") +
      '</ul></div>'
    : "";
  if (!strengthsHtml && !stepsHtml && !misconceptionsHtml) return "";
  return '<div class="two-column-lists">' + strengthsHtml + stepsHtml + misconceptionsHtml + '</div>';
}

function renderStudentPromptResult(promptDefinition, answer, isFreshResult) {
  const invite = appState.invite;
  const final = applyTeacherOverride(answer);
  const isStrong = final.understandingLevel >= 3;
  const isLastPrompt = appState.studentPromptIndex >= invite.prompts.length - 1;
  const attemptsUsed = answer.attemptNumber || 1;
  const attemptsLeft = Math.max(0, (invite.maxAttempts || 1) - attemptsUsed);
  const nextUnfinishedIndex = findFirstUnfinishedPromptIndex(invite);
  const teacherComment = answer.teacherOverride && answer.teacherOverride.comment;

  appRoot.innerHTML =
    '<div class="page-container narrow">' +
      renderPromptProgressDots() +
      '<div class="result-hero">' +
        '<div class="feedback-icon ' + (isStrong ? "good" : "growing") + '" id="resultIcon">' +
          (isStrong
            ? '<svg viewBox="0 0 24 24"><path class="draw-path" d="M4 12l5 5L20 7"/></svg>'
            : '<svg viewBox="0 0 24 24"><path class="draw-path" d="M12 20V6"/><path class="draw-path" d="M6 12l6-6 6 6" style="transition-delay:0.4s"/></svg>') +
        '</div>' +
        '<p class="label-text" style="margin-bottom:8px">' + escapeHtml(promptDefinition.question) + '</p>' +
        '<div>' + levelBadgeHtml(final.understandingLevel, true) + '</div>' +
        '<p class="small-text" style="margin-top:8px">' + escapeHtml(UNDERSTANDING_LEVELS[final.understandingLevel].description) + '</p>' +
        '<div class="coverage-meter">' +
          '<span class="small-text">Key ideas</span>' +
          '<div class="coverage-bar"><div class="coverage-bar-fill" id="coverageFill"></div></div>' +
          '<span class="coverage-number numeric">' + final.coveragePercent + '%</span>' +
        '</div>' +
        '<p class="student-feedback" id="studentFeedbackText" style="opacity:0;transition:opacity 0.4s ease">' + escapeHtml(final.studentFeedback) + '</p>' +
        (teacherComment ? '<div class="takeaway" style="text-align:left"><div class="takeaway-label">Mr Chung says</div>' + multilineToHtml(teacherComment) + '</div>' : '') +
      '</div>' +

      '<section class="widget-block">' +
        '<div class="widget-block-label">The key ideas for this question</div>' +
        renderConceptCoverageListHtml(final) +
      '</section>' +

      renderStrengthsAndStepsHtml(final) +

      '<details class="widget-block" style="cursor:pointer">' +
        '<summary class="widget-block-label" style="margin:0;list-style:none">What I heard you say</summary>' +
        '<div style="margin-top:14px">' +
          '<p class="label-text" style="margin-bottom:6px">Your answer</p>' +
          '<div class="transcript-box">' + escapeHtml(final.transcript || "(nothing heard)") + '</div>' +
          (answer.followUp ? '<p class="label-text" style="margin:14px 0 6px">Follow-up: ' + escapeHtml(answer.followUp.question) + '</p><div class="transcript-box">' + escapeHtml(final.followUpTranscript || answer.followUp.transcript || "") + '</div>' : '') +
        '</div>' +
      '</details>' +

      '<div class="button-row centered" style="margin-top:28px">' +
        (attemptsLeft > 0 ? '<button class="btn btn-secondary" id="tryAgainButton">↻ Try this question again (' + attemptsLeft + ' left)</button>' : '') +
        (nextUnfinishedIndex !== -1
          ? '<button class="btn btn-primary btn-lg" id="nextQuestionButton">Next question →</button>'
          : '<button class="btn btn-primary btn-lg" id="finishButton">' + (isLastPrompt ? "Finish 🎉" : "See my summary") + '</button>') +
      '</div>' +
    '</div>';

  requestAnimationFrame(() => {
    document.getElementById("resultIcon").classList.add("visible");
    setTimeout(() => { document.getElementById("coverageFill").style.width = final.coveragePercent + "%"; }, 300);
    setTimeout(() => { const feedbackText = document.getElementById("studentFeedbackText"); if (feedbackText) feedbackText.style.opacity = "1"; }, 700);
    if (isFreshResult && final.understandingLevel >= 3) setTimeout(() => launchConfetti(final.understandingLevel === 4 ? 40 : 22), 700);
  });

  const tryAgainButton = document.getElementById("tryAgainButton");
  if (tryAgainButton) tryAgainButton.addEventListener("click", async () => {
    const confirmed = await confirmAction("Try again?", "Your new answer will replace this one. Mr Chung can still see your earlier try.", "Yes, record again");
    if (confirmed) renderStudentPromptScreen();
  });
  const nextQuestionButton = document.getElementById("nextQuestionButton");
  if (nextQuestionButton) nextQuestionButton.addEventListener("click", () => {
    appState.studentPromptIndex = findFirstUnfinishedPromptIndex(invite);
    renderStudentPromptScreen();
    window.scrollTo({ top: 0, behavior: "smooth" });
  });
  const finishButton = document.getElementById("finishButton");
  if (finishButton) finishButton.addEventListener("click", () => renderStudentDoneScreen(true));
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function renderStudentDoneScreen(isFreshCompletion) {

function stopAdminListeners() {

async function startAdminMode() {
  appState.mode = "admin";
  await loadSettings();
  if (!appState.composeDraft) appState.composeDraft = createEmptyComposeDraft();

  stopAdminListeners();
  appState.unsubscribeStudents = onSnapshot(
    query(collection(firestore, COLLECTION_STUDENTS), orderBy("name")),
    snapshot => {
      appState.students = snapshot.docs.map(studentDoc => ({ id: studentDoc.id, ...studentDoc.data() }));
      refreshActiveAdminTabIfDataDriven("students");
      updateAdminTabCounts();
    },
    listenError => { console.error("[VoiceCheck] Students listener:", listenError); showToast("Could not load students — check Firestore rules.", "error", 6000); }
  );
  appState.unsubscribeAssignments = onSnapshot(
    query(collection(firestore, COLLECTION_ASSIGNMENTS), orderBy("createdAt", "desc")),
    snapshot => {
      appState.assignments = snapshot.docs.map(assignmentDoc => ({ id: assignmentDoc.id, ...assignmentDoc.data() }));
      refreshActiveAdminTabIfDataDriven("assignments");
      updateAdminTabCounts();
    },
    listenError => { console.error("[VoiceCheck] Assignments listener:", listenError); }
  );

}

function parseBulkStudentText(rawText) {
  const valid = [];
  const invalid = [];
  rawText.split(/\r?\n/).map(line => line.trim()).filter(Boolean).forEach(line => {
    const parts = line.split(/\t|,/).map(part => part.trim());
    const emailIndex = parts.findIndex(part => isValidEmailAddress(part));
    if (emailIndex === -1) { invalid.push(line); return; }
    const email = parts[emailIndex].toLowerCase();
    const remaining = parts.filter((part, index) => index !== emailIndex);
    const name = remaining[0] || email.split("@")[0];
    const levelCandidate = (remaining[1] || "").toUpperCase();
    const level = LEVEL_OPTIONS.includes(levelCandidate) ? levelCandidate : "P5";
    const group = remaining.slice(LEVEL_OPTIONS.includes(levelCandidate) ? 2 : 1).join(", ");
    valid.push({ name, email, level, group });
  });
  return { valid, invalid };
}

async function handleBulkAddStudents() {
  const bulkButton = document.getElementById("bulkAddButton");
  const parsed = parseBulkStudentText(document.getElementById("bulkStudentText").value);
  const existingKeys = new Set(appState.students.map(student => student.email + "|" + student.name.toLowerCase()));
  const toAdd = parsed.valid.filter(student => !existingKeys.has(student.email + "|" + student.name.toLowerCase()));
  if (!toAdd.length) { showToast("Nothing new to import.", "info"); return; }
  setButtonLoading(bulkButton, true);
  try {
    for (let start = 0; start < toAdd.length; start += 400) {
      const batch = writeBatch(firestore);
      toAdd.slice(start, start + 400).forEach(student => {
        batch.set(doc(collection(firestore, COLLECTION_STUDENTS)), { ...student, createdAt: serverTimestamp() });
      });
      await batch.commit();
    }
    flashButtonSuccess(bulkButton, "✓ Imported " + toAdd.length);
    document.getElementById("bulkStudentText").value = "";
    document.getElementById("bulkPreviewText").textContent = "";
  } catch (bulkError) {
    setButtonLoading(bulkButton, false);
    flashButtonError(bulkButton);
    showToast("Import failed: " + bulkError.message, "error");
  }
}

function updateLinkBaseNotice() {
  const notice = document.getElementById("linkBaseNotice");
  if (!notice) return;
  const base = getStudentLinkBaseUrl();
  if (!base) {
    notice.className = "notice warn";
    notice.innerHTML = "⚠️ This page is opened from a file, so student links have nowhere to point. Upload it to the CER hosting, or set the <strong>Student link base URL</strong> in Settings.";
  } else {
    notice.className = "notice info";
    notice.innerHTML = "Student links will look like: <code>" + escapeHtml(base) + "?invite=…</code> — change this in Settings if needed.";
  }
}

let emailPreviewDebounceTimer = null;
function scheduleEmailPreviewUpdate() {
  clearTimeout(emailPreviewDebounceTimer);
  emailPreviewDebounceTimer = setTimeout(updateEmailPreview, 450);
}

function wireComposeDetailFields() {
  const draft = appState.composeDraft;
  const bindValue = (elementId, draftKey, onChange) => {
    const element = document.getElementById(elementId);
    element.addEventListener("input", () => {
      draft[draftKey] = element.value;
      if (onChange) onChange(element.value);
      scheduleEmailPreviewUpdate();
    });
  };
  bindValue("composeSubject", "subject");
  bindValue("composeLevel", "level", newLevel => {
    // Helpful default: filter recipients to the same level.
    appState.recipientFilterLevel = newLevel;
    const filterSelect = document.getElementById("recipientFilterLevel");
    if (filterSelect) filterSelect.value = newLevel;
    renderRecipientPicker();
  });
  bindValue("composeDueDate", "dueDate");
  bindValue("composeTitle", "title");
  bindValue("composePersonalMessage", "personalMessage");
  bindValue("composeTopic", "topic", newTopic => {
    draft.prompts.forEach((promptDefinition, index) => {
      if (!promptDefinition.questionIsAutomatic) return;
      promptDefinition.question = buildAutomaticQuestion(newTopic);
      const questionInput = document.querySelector('[data-prompt-question="' + index + '"]');
      if (questionInput) questionInput.value = promptDefinition.question;
    });
  });

  const maxSecondsSlider = document.getElementById("composeMaxSeconds");
  const maxSecondsValue = document.getElementById("composeMaxSecondsValue");
  maxSecondsSlider.addEventListener("input", () => {
    draft.maxRecordingSeconds = Number(maxSecondsSlider.value);
    maxSecondsValue.textContent = formatSeconds(draft.maxRecordingSeconds) + " min";
    maxSecondsValue.classList.remove("pulse");
    void maxSecondsValue.offsetWidth;
    maxSecondsValue.classList.add("pulse");
    scheduleEmailPreviewUpdate();
  });

  const attemptsValue = document.getElementById("attemptsValue");
  document.getElementById("attemptsMinusButton").addEventListener("click", () => {
    draft.maxAttempts = clampNumber(draft.maxAttempts - 1, 1, 3);
    attemptsValue.textContent = draft.maxAttempts;
  });
  document.getElementById("attemptsPlusButton").addEventListener("click", () => {
    draft.maxAttempts = clampNumber(draft.maxAttempts + 1, 1, 3);
    attemptsValue.textContent = draft.maxAttempts;
  });
  document.getElementById("composeFollowUp").addEventListener("change", event => { draft.followUpEnabled = event.target.checked; scheduleEmailPreviewUpdate(); });
  document.getElementById("composeNotify").addEventListener("change", event => { draft.notifyAdminOnComplete = event.target.checked; });

  document.getElementById("recipientFilterLevel").addEventListener("change", event => { appState.recipientFilterLevel = event.target.value; renderRecipientPicker(); });
  document.getElementById("recipientFilterGroup").addEventListener("change", event => { appState.recipientFilterGroup = event.target.value; renderRecipientPicker(); });
  document.getElementById("recipientSearch").addEventListener("input", event => { appState.recipientSearchText = event.target.value; renderRecipientPicker(); });
  document.getElementById("selectAllVisibleButton").addEventListener("click", () => {
    getVisibleRecipientStudents().forEach(student => appState.selectedRecipientIds.add(student.id));
    renderRecipientPicker();
    updateEmailPreview();
  });
  document.getElementById("clearSelectionButton").addEventListener("click", () => {
    appState.selectedRecipientIds.clear();
    renderRecipientPicker();
    updateEmailPreview();
  });
}

/* ---------- Prompt + key concept editors ---------- */
function renderPromptEditors() {
  const draft = appState.composeDraft;
  const list = document.getElementById("promptEditorList");
  if (!list) return;

  list.innerHTML = draft.prompts.map((promptDefinition, promptIndex) =>
    '<div class="prompt-editor-card" data-prompt-card="' + promptIndex + '">' +
      '<div class="prompt-editor-head">' +
        '<h4><span class="step-number">Q' + (promptIndex + 1) + '</span>Spoken question</h4>' +
        (draft.prompts.length > 1 ? '<button class="btn btn-ghost btn-xs" data-remove-prompt="' + promptIndex + '">Remove question</button>' : '') +
      '</div>' +
      '<div class="field" style="margin-bottom:18px">' +
        '<textarea class="text-area" data-prompt-question="' + promptIndex + '" style="min-height:64px">' + escapeHtml(promptDefinition.question) + '</textarea>' +
        '<span class="field-hint">' + (promptDefinition.questionIsAutomatic ? "Auto-filled from the topic — edit it any time." : "Custom question.") + '</span>' +
      '</div>' +
      '<div class="button-row spread" style="margin-bottom:10px">' +
        '<span class="field-label" style="font-weight:600;color:var(--text-secondary)">Key concepts Gemini listens for <span class="small-text">(' + promptDefinition.keyConcepts.length + ')</span></span>' +
        '<div class="button-row">' +
          '<button class="btn btn-secondary btn-xs" data-generate-concepts="' + promptIndex + '" data-tooltip="Drafts concepts at the depth of the chosen level\'s syllabus. Always check them.">✨ Draft with AI</button>' +
          '<button class="btn btn-ghost btn-xs" data-add-concept="' + promptIndex + '">+ Add concept</button>' +
        '</div>' +
      '</div>' +
      (promptDefinition.keyConcepts.length
        ? '<div class="concept-editor-header"><span class="label-text">Concept</span><span class="label-text">Keywords (comma)</span><span class="label-text">What full understanding sounds like</span><span></span></div>'
        : '<div class="empty-state" style="padding:20px;margin-bottom:8px">No key concepts yet. Tap <strong>✨ Draft with AI</strong> or add your own.</div>') +
      promptDefinition.keyConcepts.map((concept, conceptIndex) =>
        '<div class="concept-editor-row">' +
          '<input class="text-input compact" placeholder="e.g. Heat flows hot → cold" value="' + escapeAttribute(concept.name) + '" data-concept-field="name" data-prompt-index="' + promptIndex + '" data-concept-index="' + conceptIndex + '">' +
          '<input class="text-input compact" placeholder="gain heat, lose heat" value="' + escapeAttribute((concept.keywords || []).join(", ")) + '" data-concept-field="keywords" data-prompt-index="' + promptIndex + '" data-concept-index="' + conceptIndex + '">' +
          '<textarea class="text-area text-input compact" placeholder="Heat flows from a hotter object to a cooler one until both reach the same temperature." data-concept-field="goodAnswer" data-prompt-index="' + promptIndex + '" data-concept-index="' + conceptIndex + '">' + escapeHtml(concept.goodAnswer || "") + '</textarea>' +
          '<button class="icon-only-button" title="Remove concept" aria-label="Remove concept" data-remove-concept="' + conceptIndex + '" data-prompt-index="' + promptIndex + '">✕</button>' +
        '</div>'
      ).join("") +
      '<div class="field" style="margin-top:14px">' +
        '<label>Misconceptions to watch for <span class="field-hint">(optional, one per line — helps Gemini catch them)</span></label>' +
        '<textarea class="text-area" data-prompt-misconceptions="' + promptIndex + '" placeholder="e.g. Cold flows into objects.">' + escapeHtml(promptDefinition.misconceptionsToWatch || "") + '</textarea>' +
      '</div>' +
    '</div>'
  ).join("");

  list.querySelectorAll("[data-prompt-question]").forEach(textarea => textarea.addEventListener("input", () => {
    const promptDefinition = draft.prompts[Number(textarea.dataset.promptQuestion)];
    promptDefinition.question = textarea.value;
    promptDefinition.questionIsAutomatic = false;
    scheduleEmailPreviewUpdate();
  }));
  list.querySelectorAll("[data-prompt-misconceptions]").forEach(textarea => textarea.addEventListener("input", () => {
    draft.prompts[Number(textarea.dataset.promptMisconceptions)].misconceptionsToWatch = textarea.value;
  }));
  list.querySelectorAll("[data-concept-field]").forEach(input => input.addEventListener("input", () => {
    const concept = draft.prompts[Number(input.dataset.promptIndex)].keyConcepts[Number(input.dataset.conceptIndex)];
    if (input.dataset.conceptField === "keywords") concept.keywords = input.value.split(",").map(keyword => keyword.trim()).filter(Boolean);
    else concept[input.dataset.conceptField] = input.value;
  }));
  list.querySelectorAll("[data-remove-concept]").forEach(button => button.addEventListener("click", () => {
    draft.prompts[Number(button.dataset.promptIndex)].keyConcepts.splice(Number(button.dataset.removeConcept), 1);
    renderPromptEditors();
  }));
  list.querySelectorAll("[data-add-concept]").forEach(button => button.addEventListener("click", () => {
    draft.prompts[Number(button.dataset.addConcept)].keyConcepts.push({ id: generateShortId("c"), name: "", keywords: [], goodAnswer: "" });
    renderPromptEditors();
    const rows = list.querySelectorAll('[data-prompt-card="' + button.dataset.addConcept + '"] .concept-editor-row input[data-concept-field="name"]');
    if (rows.length) rows[rows.length - 1].focus();
  }));
  list.querySelectorAll("[data-remove-prompt]").forEach(button => button.addEventListener("click", async () => {
    const confirmed = await confirmAction("Remove this question?", "Its key concepts will be removed too.", "Remove", true);
    if (!confirmed) return;
    draft.prompts.splice(Number(button.dataset.removePrompt), 1);
    renderPromptEditors();
    updateEmailPreview();
  }));
  list.querySelectorAll("[data-generate-concepts]").forEach(button => button.addEventListener("click", () => handleGenerateConcepts(button)));
}

async function handleGenerateConcepts(button) {
  const draft = appState.composeDraft;
  const promptIndex = Number(button.dataset.generateConcepts);
  const promptDefinition = draft.prompts[promptIndex];
  if (!draft.topic.trim()) { showToast("Type the topic first so the AI knows what to draft.", "error"); document.getElementById("composeTopic").focus(); return; }
  setButtonLoading(button, true);
  try {
    const existingNames = promptDefinition.keyConcepts.map(concept => concept.name).filter(Boolean);
    const generated = await generateKeyConceptsWithAI({
      subject: draft.subject, level: draft.level, topic: draft.topic,
      question: promptDefinition.question, existingConcepts: existingNames
    });
    if (!generated.keyConcepts.length) throw new Error("No concepts returned.");
    promptDefinition.keyConcepts = generated.keyConcepts;
    if (!promptDefinition.misconceptionsToWatch.trim() && generated.misconceptions.length) {
      promptDefinition.misconceptionsToWatch = generated.misconceptions.join("\n");
    }
    renderPromptEditors();
    showToast("Drafted " + generated.keyConcepts.length + " key concepts — please check them.", "success");
  } catch (generateError) {
    console.error("[VoiceCheck] Concept generation failed:", generateError);
    setButtonLoading(button, false);
    flashButtonError(button);
    showToast("AI draft failed: " + describeGeminiError(generateError), "error", 6000);
  }
}

/* ---------- Recipient picker ---------- */
function getVisibleRecipientStudents() {
  const searchText = appState.recipientSearchText.trim().toLowerCase();
  return appState.students.filter(student =>
    (appState.recipientFilterLevel === "all" || student.level === appState.recipientFilterLevel) &&
    (appState.recipientFilterGroup === "all" || (student.group || "") === appState.recipientFilterGroup) &&
    (!searchText || [student.name, student.email, student.group].join(" ").toLowerCase().includes(searchText))
  );
}

function renderRecipientPicker() {
  const grid = document.getElementById("recipientPickerGrid");
  if (!grid) return;

  const groupSelect = document.getElementById("recipientFilterGroup");
  if (groupSelect) {
    const groups = getAllStudentGroups();
    if (appState.recipientFilterGroup !== "all" && !groups.includes(appState.recipientFilterGroup)) appState.recipientFilterGroup = "all";
    groupSelect.innerHTML = '<option value="all">All groups</option>' + groups.map(group =>
      '<option value="' + escapeAttribute(group) + '"' + (group === appState.recipientFilterGroup ? " selected" : "") + '>' + escapeHtml(group) + '</option>').join("");
  }

  // Drop selections for students who were deleted.
  const existingIds = new Set(appState.students.map(student => student.id));
  [...appState.selectedRecipientIds].forEach(studentId => { if (!existingIds.has(studentId)) appState.selectedRecipientIds.delete(studentId); });

  const visibleStudents = getVisibleRecipientStudents();
  if (!appState.students.length) {
    grid.innerHTML = '<div class="empty-state"><div class="empty-emoji">👩‍🎓</div>Add students in the <strong>Students</strong> tab first.</div>';
  } else if (!visibleStudents.length) {
    grid.innerHTML = '<div class="empty-state">No students match these filters.</div>';
  } else {
    grid.innerHTML = '<div class="recipient-grid">' + visibleStudents.map(student => {
      const isSelected = appState.selectedRecipientIds.has(student.id);
      return '<label class="recipient-card' + (isSelected ? " selected" : "") + '">' +
        '<input type="checkbox" data-recipient-id="' + student.id + '"' + (isSelected ? " checked" : "") + '>' +
        '<div><div class="recipient-name">' + escapeHtml(student.name) + '</div>' +
        '<div class="recipient-meta">' + escapeHtml(student.level || "") + (student.group ? " · " + escapeHtml(student.group) : "") + " · " + escapeHtml(student.email) + '</div></div>' +
      '</label>';
    }).join("") + '</div>';
    grid.querySelectorAll("[data-recipient-id]").forEach(checkbox => checkbox.addEventListener("change", () => {
      if (checkbox.checked) appState.selectedRecipientIds.add(checkbox.dataset.recipientId);
      else appState.selectedRecipientIds.delete(checkbox.dataset.recipientId);
      checkbox.closest(".recipient-card").classList.toggle("selected", checkbox.checked);
      updateRecipientCount();
      scheduleEmailPreviewUpdate();
    }));
  }
  updateRecipientCount();
}

function updateRecipientCount() {
  const countText = document.getElementById("recipientCountText");
  const sendButton = document.getElementById("sendToStudentsButton");
  const selectedCount = appState.selectedRecipientIds.size;
  if (countText) countText.textContent = selectedCount ? pluralise(selectedCount, "student") + " selected." : "Pick the students who should get this Voice Check.";
  if (sendButton && !sendButton.classList.contains("is-loading") && !sendButton.classList.contains("is-success")) {
    sendButton.innerHTML = "🚀 Send to " + (selectedCount ? pluralise(selectedCount, "student") : "students");
  }
}

function getSelectedRecipientStudents() {
  return appState.students.filter(student => appState.selectedRecipientIds.has(student.id));
}

function buildAssignmentFromDraft() {
  const draft = appState.composeDraft;
  const topic = draft.topic.trim();
  return {
    title: draft.title.trim() || ("Voice Check: " + topic),
    subject: draft.subject,
    level: draft.level,
    topic,
    personalMessage: draft.personalMessage.trim(),
    dueDate: draft.dueDate ? Timestamp.fromDate(new Date(draft.dueDate + "T23:59:00+08:00")) : null,
    prompts: draft.prompts.map(promptDefinition => ({
      id: promptDefinition.id,
      question: promptDefinition.question.trim(),
      keyConcepts: promptDefinition.keyConcepts
        .filter(concept => concept.name.trim())
        .map(concept => ({ id: concept.id, name: concept.name.trim(), keywords: concept.keywords || [], goodAnswer: (concept.goodAnswer || "").trim() })),
      misconceptionsToWatch: (promptDefinition.misconceptionsToWatch || "").trim()
    })),
    maxRecordingSeconds: clampNumber(draft.maxRecordingSeconds, 30, 300),
    maxAttempts: clampNumber(draft.maxAttempts, 1, 3),
    followUpEnabled: Boolean(draft.followUpEnabled),
    notifyAdminOnComplete: Boolean(draft.notifyAdminOnComplete)
  };
}

function validateAssignment(assignment) {
  if (!assignment.topic) return "Please type the topic.";
  for (let index = 0; index < assignment.prompts.length; index++) {
    const promptDefinition = assignment.prompts[index];
    if (!promptDefinition.question) return "Question " + (index + 1) + " is empty.";
    if (!promptDefinition.keyConcepts.length) return "Question " + (index + 1) + " needs at least one key concept — try ✨ Draft with AI.";
  }
  return null;
}

function updateEmailPreview() {
  const frame = document.getElementById("emailPreviewFrame");
  if (!frame) return;
  const assignment = buildAssignmentFromDraft();
  if (!assignment.topic) assignment.topic = "your topic";
  const firstRecipient = getSelectedRecipientStudents()[0];
  const emailContent = buildInviteEmail({
    studentName: firstRecipient ? firstRecipient.name : "Student",
    assignment,
    link: buildStudentLink("PREVIEW-TOKEN")
  });
  frame.srcdoc = emailContent.html;
}

/* ---------- Sending ---------- */
async function sendVoiceCheck(button, isTestSend) {
  const assignment = buildAssignmentFromDraft();
  const validationProblem = validateAssignment(assignment);
  if (validationProblem) { showToast(validationProblem, "error", 5000); flashButtonError(button); return; }
  if (!getStudentLinkBaseUrl()) { showToast("Set the Student link base URL in Settings first.", "error", 5000); flashButtonError(button); return; }

  const recipients = isTestSend
    ? [{ id: "test-admin", name: "Mr Chung (test)", email: ADMIN_EMAIL, level: assignment.level, group: "" }]
    : getSelectedRecipientStudents();
  if (!recipients.length) { showToast("Select at least one student.", "error"); flashButtonError(button); return; }

  if (!isTestSend) {
    const confirmed = await confirmAction(
      "Send to " + pluralise(recipients.length, "student") + "?",
      "Each student gets a personal email with a microphone link for “" + assignment.topic + "”.",
      "Send now"
    );
    if (!confirmed) return;
  }

  setButtonLoading(button, true);
  try {
    const assignmentReference = doc(collection(firestore, COLLECTION_ASSIGNMENTS));
    await setDoc(assignmentReference, {
      ...assignment,
      title: isTestSend ? "[TEST] " + assignment.title : assignment.title,
      isTest: isTestSend,
      recipientCount: recipients.length,
      createdAt: serverTimestamp(),
      createdBy: appState.currentUser.email,
      studentLinkBaseUrl: getStudentLinkBaseUrl()
    });

    let testLink = "";
    const recipientsPerBatch = 200;               // 2 writes each (invite + mail) → 400 per batch
    for (let start = 0; start < recipients.length; start += recipientsPerBatch) {
      const batch = writeBatch(firestore);
      recipients.slice(start, start + recipientsPerBatch).forEach(student => {
        const inviteToken = generateSecureToken(28);
        const link = buildStudentLink(inviteToken);
        if (isTestSend) testLink = link;
        batch.set(doc(firestore, COLLECTION_INVITES, inviteToken), {
          token: inviteToken,
          assignmentId: assignmentReference.id,
          isTest: isTestSend,
          title: isTestSend ? "[TEST] " + assignment.title : assignment.title,
          subject: assignment.subject,
          level: assignment.level,
          topic: assignment.topic,
          personalMessage: assignment.personalMessage,
          dueDate: assignment.dueDate,
          prompts: assignment.prompts,
          maxRecordingSeconds: assignment.maxRecordingSeconds,
          maxAttempts: assignment.maxAttempts,
          followUpEnabled: assignment.followUpEnabled,
          notifyAdminOnComplete: assignment.notifyAdminOnComplete,
          studentId: student.id,
          studentName: student.name,
          studentEmail: student.email,
          studentGroup: student.group || "",
          status: "sent",
          sentAt: serverTimestamp(),
          emailCount: 1,
          answers: {},
          overall: null,
          completedAt: null
        });
        const emailContent = buildInviteEmail({ studentName: student.name, assignment, link });
        batch.set(doc(collection(firestore, COLLECTION_MAIL)), {
          to: student.email,
          replyTo: appState.settings.replyToEmail || ADMIN_EMAIL,
          message: { subject: emailContent.subject, html: emailContent.html, text: emailContent.text },
          createdAt: serverTimestamp(),
          source: "voice-check"
        });
      });
      await batch.commit();
    }

    flashButtonSuccess(button, isTestSend ? "✓ Test sent" : "✓ Sent to " + recipients.length);
    if (isTestSend) {
      openModal(
        '<h3 class="sub-heading" style="padding-right:40px">📨 Test email queued</h3>' +
        '<p class="body-text">Check <strong>' + escapeHtml(ADMIN_EMAIL) + '</strong> in a minute. You can also open the student page straight away:</p>' +
        '<div class="transcript-box" style="margin:14px 0;word-break:break-all">' + escapeHtml(testLink) + '</div>' +
        '<p class="small-text">Tip: open it in a private / incognito window to experience it exactly as a student (anonymous).</p>' +
        '<div class="button-row" style="justify-content:flex-end;margin-top:18px">' +
          '<button class="btn btn-ghost btn-sm" id="copyTestLinkButton">Copy link</button>' +
          '<a class="btn btn-primary btn-sm" href="' + escapeAttribute(testLink) + '" target="_blank" rel="noopener">Open student page ↗</a>' +
        '</div>',
        { small: true }
      );
      document.getElementById("copyTestLinkButton").addEventListener("click", () => copyTextToClipboard(testLink));
    } else {
      showToast("Voice Check sent to " + pluralise(recipients.length, "student") + ".", "success", 4500);
      appState.selectedAssignmentId = assignmentReference.id;
      setTimeout(() => switchAdminTab("results"), 1200);
    }
  } catch (sendError) {
    console.error("[VoiceCheck] Send failed:", sendError);
    setButtonLoading(button, false);
    flashButtonError(button);
    showToast("Sending failed: " + sendError.message, "error", 7000);
  }
}

async function copyTextToClipboard(text) {
  try {
    await navigator.clipboard.writeText(text);
    showToast("Copied to clipboard.", "success");
  } catch (clipboardError) {
    window.prompt("Copy this:", text);
  }
}

    title: String(assignment.title || "").replace(/^\[TEST\]\s*/, ""),
    subject: assignment.subject || "Science",
    level: assignment.level || "P5",

      id: "p" + generateSecureToken(6),
      question: promptDefinition.question,
      questionIsAutomatic: false,
      keyConcepts: (promptDefinition.keyConcepts || []).map(concept => ({ ...concept, id: generateShortId("c") })),
      misconceptionsToWatch: promptDefinition.misconceptionsToWatch || ""

function subscribeToSelectedAssignmentInvites() {
  if (typeof appState.unsubscribeInvites === "function") appState.unsubscribeInvites();

    query(collection(firestore, COLLECTION_INVITES), where("assignmentId", "==", appState.selectedAssignmentId)),

function computeClassStatistics(invites, assignment) {
  const completedInvites = invites.filter(invite => invite.status === "completed");
  const openedCount = invites.filter(invite => invite.status !== "sent").length;
  const levelCounts = { 1: 0, 2: 0, 3: 0, 4: 0 };
  let coverageTotal = 0;
  completedInvites.forEach(invite => {
    const overall = computeOverallResult(invite);
    if (!overall) return;
    levelCounts[overall.understandingLevel] += 1;
    coverageTotal += overall.averageCoveragePercent;
  });

  const conceptStatistics = (assignment.prompts || []).map(promptDefinition => ({
    promptId: promptDefinition.id,
    question: promptDefinition.question,
    concepts: (promptDefinition.keyConcepts || []).map(concept => {
      const tally = { explained: 0, mentioned: 0, missing: 0, incorrect: 0, total: 0 };
      invites.forEach(invite => {
        const answer = (invite.answers || {})[promptDefinition.id];
        if (!answer || !answer.final) return;
        const item = (answer.final.conceptCoverage || []).find(coverage => coverage.conceptId === concept.id);
        const status = item ? item.status : "missing";
        tally[status] = (tally[status] || 0) + 1;
        tally.total += 1;
      });
      return { conceptId: concept.id, name: concept.name, ...tally };
    })
  }));

  return {
    sentCount: invites.length,
    openedCount,
    completedCount: completedInvites.length,
    averageCoverage: completedInvites.length ? Math.round(coverageTotal / completedInvites.length) : null,
    levelCounts,
    conceptStatistics
  };
}

let openInviteToken = null;

function refreshOpenInviteModalIfAny() {
  if (!openInviteToken || !document.getElementById("inviteDetailModal")) return;
  // Avoid wiping out a teacher who is mid-typing a comment.
  const active = document.activeElement;
  if (active && active.closest && active.closest("#inviteDetailModal") && /TEXTAREA|INPUT|SELECT/.test(active.tagName)) return;
  openInviteDetailModal(openInviteToken, true);
}

function openInviteDetailModal(inviteToken, isRefresh = false) {
  const invite = appState.selectedAssignmentInvites.find(item => item.token === inviteToken);
  if (!invite) return;
  openInviteToken = inviteToken;
  const scrollPosition = isRefresh && document.getElementById("modalBackdrop") ? document.getElementById("modalBackdrop").scrollTop : 0;
  const overall = computeOverallResult(invite);

  const promptSectionsHtml = (invite.prompts || []).map((promptDefinition, promptIndex) => {
    const answer = (invite.answers || {})[promptDefinition.id];
    if (!answer) {
      return '<div class="widget-block"><div class="widget-block-label">Q' + (promptIndex + 1) + '</div><p style="font-weight:600">' + escapeHtml(promptDefinition.question) + '</p><p class="small-text" style="margin-top:6px">Not answered yet.</p></div>';
    }
    const final = answer.final ? applyTeacherOverride(answer) : null;
    const working = final || answer.firstPass;
    const override = answer.teacherOverride || {};

    return '<div class="widget-block" style="margin:18px 0">' +
      '<div class="widget-block-label">Q' + (promptIndex + 1) + (answer.attemptNumber > 1 ? ' · attempt ' + answer.attemptNumber : '') + (final ? '' : ' · waiting for follow-up answer') + '</div>' +

  // Close handler should forget which invite was open.

async function saveTeacherOverride(button, invite, promptId) {
  const levelSelect = document.querySelector('[data-override-level="' + promptId + '"]');
  const commentInput = document.querySelector('[data-override-comment="' + promptId + '"]');
  const overrideLevel = levelSelect.value ? Number(levelSelect.value) : null;
  const comment = commentInput.value.trim();
  setButtonLoading(button, true);
  try {
    const answers = { ...(invite.answers || {}) };
    answers[promptId] = { ...answers[promptId], teacherOverride: overrideLevel || comment ? { understandingLevel: overrideLevel, comment, updatedAt: new Date().toISOString() } : null };
    const updatedInvite = { ...invite, answers };
    const update = { ["answers." + promptId + ".teacherOverride"]: answers[promptId].teacherOverride };
    if (invite.status === "completed") update.overall = computeOverallResult(updatedInvite);
    await updateDoc(doc(firestore, COLLECTION_INVITES, invite.token), update);
    flashButtonSuccess(button, "✓ Saved");
    document.activeElement && document.activeElement.blur && document.activeElement.blur();
  } catch (overrideError) {
    setButtonLoading(button, false);
    flashButtonError(button);
    showToast("Save failed: " + overrideError.message, "error");
  }
}

async function rejudgeFromTranscripts(button, invite, promptId) {
  const assignment = getSelectedAssignment() || invite;
  const assignmentPrompt = (assignment.prompts || []).find(item => item.id === promptId);
  const invitePrompt = (invite.prompts || []).find(item => item.id === promptId);
  const promptDefinition = assignmentPrompt || invitePrompt;
  const answer = (invite.answers || {})[promptId];
  if (!answer || !answer.final) return;
  setButtonLoading(button, true);
  try {
    const rawJudgement = await askGeminiJson(buildTranscriptRejudgePrompt(
      { subject: invite.subject, level: invite.level, topic: invite.topic },
      promptDefinition,
      answer.main ? answer.main.transcript : answer.final.transcript,
      answer.followUp ? answer.followUp.question : "",
      answer.followUp ? answer.followUp.transcript : ""
    ));
    const judgement = normaliseJudgement(rawJudgement, promptDefinition);
    judgement.transcript = answer.main ? answer.main.transcript : answer.final.transcript;
    judgement.followUpTranscript = answer.followUp ? answer.followUp.transcript : "";
    judgement.followUpQuestion = "";
    judgement.rejudgedFromTranscripts = true;

    const answers = { ...(invite.answers || {}), [promptId]: { ...answer, final: judgement } };
    await updateDoc(doc(firestore, COLLECTION_INVITES, invite.token), {
      ["answers." + promptId + ".final"]: judgement,
      overall: computeOverallResult({ ...invite, answers })
    });
    flashButtonSuccess(button, "✓ Re-judged");
  } catch (rejudgeError) {
    console.error("[VoiceCheck] Re-judge failed:", rejudgeError);
    setButtonLoading(button, false);
    flashButtonError(button);
    showToast(describeGeminiError(rejudgeError), "error", 6000);
  }
}

function exportAssignmentCsv(assignment, invites) {
  const header = ["Student", "Email", "Group", "Status", "Overall level", "Overall key ideas %"];
  (assignment.prompts || []).forEach((promptDefinition, index) => {
    header.push("Q" + (index + 1) + " level", "Q" + (index + 1) + " key ideas %");
    (promptDefinition.keyConcepts || []).forEach(concept => header.push("Q" + (index + 1) + ": " + concept.name));
    header.push("Q" + (index + 1) + " transcript", "Q" + (index + 1) + " follow-up transcript", "Q" + (index + 1) + " teacher comment");
  });
  const rows = invites.map(invite => {
    const overall = computeOverallResult(invite);
    const row = [invite.studentName, invite.studentEmail, invite.studentGroup || "", invite.status,
      overall ? UNDERSTANDING_LEVELS[overall.understandingLevel].label : "", overall ? overall.averageCoveragePercent : ""];
    (assignment.prompts || []).forEach(promptDefinition => {
      const answer = (invite.answers || {})[promptDefinition.id];
      const final = answer && answer.final ? applyTeacherOverride(answer) : null;
      row.push(final ? UNDERSTANDING_LEVELS[final.understandingLevel].label : "", final ? final.coveragePercent : "");
      (promptDefinition.keyConcepts || []).forEach(concept => {
        const item = final ? final.conceptCoverage.find(coverage => coverage.conceptId === concept.id) : null;
        row.push(item ? CONCEPT_STATUS[item.status].label : "");
      });
      row.push(answer && answer.main ? answer.main.transcript : "", answer && answer.followUp ? answer.followUp.transcript : "",
        answer && answer.teacherOverride ? answer.teacherOverride.comment || "" : "");
    });
    return row;
  });
  const csvText = [header, ...rows].map(row => row.map(csvEscape).join(",")).join("\n");
  const safeName = String(assignment.title || "voice-check").replace(/[^\w\- ]+/g, "").replace(/\s+/g, "-").slice(0, 60);
  downloadTextFile(safeName + ".csv", "\uFEFF" + csvText, "text/csv");
}

async function deleteAssignmentWithInvites(assignment, invites) {
  const confirmed = await confirmAction(
    "Delete “" + assignment.title + "”?",
    "This removes the Voice Check and all " + invites.length + " student results. Student links will stop working. Audio files stay in Storage.",
    "Delete everything", true
  );
  if (!confirmed) return;
  try {
    for (let start = 0; start < invites.length; start += 450) {
      const batch = writeBatch(firestore);
      invites.slice(start, start + 450).forEach(invite => batch.delete(doc(firestore, COLLECTION_INVITES, invite.token)));
      await batch.commit();
    }
    await deleteDoc(doc(firestore, COLLECTION_ASSIGNMENTS, assignment.id));
    appState.selectedAssignmentId = null;
    showToast("Deleted.", "success");
  } catch (deleteError) {
    showToast("Delete failed: " + deleteError.message, "error");
  }
}

function systemCheckRowHtml(checkId, title, detail, status) {
  return '<li class="concept-item status-' + status + '" data-check-id="' + checkId + '">' +

    '<div><div class="concept-name">' + escapeHtml(title) + '</div><div class="concept-comment" data-check-detail>' + detail + '</div></div>' +
  '</li>';
}

function updateSystemCheckRow(checkId, status, detailText) {
  const row = document.querySelector('[data-check-id="' + checkId + '"]');
  if (!row) return;
  row.className = "concept-item status-" + status;
  row.querySelector(".concept-status-icon").textContent = CONCEPT_STATUS[status].icon;
  row.querySelector("[data-check-detail]").textContent = detailText;
}

async function runMicrophoneSystemTest(button) {
  setButtonLoading(button, true);
  updateSystemCheckRow("mic", "mentioned", "Recording for 5 seconds — say: “Heat flows from a hotter object to a colder object.”");
  try {
    await startVoiceRecording({ maximumSeconds: 6, onLevel: null, onTick: null, onAutoStop: null });
    await sleep(5000);
    const recordedAudio = await stopVoiceRecording();
    updateSystemCheckRow("mic", "mentioned", "Recorded " + recordedAudio.durationSeconds + "s (" + recordedAudio.mimeType + "). Sending to Gemini…");
    const geminiAudio = await prepareAudioForGemini(recordedAudio);
    const testPrompt = {
      id: "test",
      question: "What is heat transfer?",
      keyConcepts: [{ id: "c_test", name: "Heat flows from hotter to colder", keywords: ["hotter", "colder"], goodAnswer: "Heat flows from a hotter object to a colder object." }],
      misconceptionsToWatch: ""
    };
    const raw = await askGeminiJsonWithAudio(buildFirstPassPrompt({ subject: "Science", level: "P5", topic: "Heat" }, testPrompt), geminiAudio.base64, geminiAudio.mimeType);
    const judgement = normaliseJudgement(raw, testPrompt);
    URL.revokeObjectURL(recordedAudio.objectUrl);
    updateSystemCheckRow("mic", judgement.audioQuality === "silent" ? "mentioned" : "explained",
      "Heard: “" + (judgement.transcript || "(nothing)").slice(0, 140) + "” → concept " + judgement.conceptCoverage[0].status + ", audio " + judgement.audioQuality + ".");
    setButtonLoading(button, false);
  } catch (micError) {
    console.error("[VoiceCheck] Mic test failed:", micError);
    cancelVoiceRecording();
    updateSystemCheckRow("mic", "incorrect", String(micError.message || micError).slice(0, 200));
    setButtonLoading(button, false);
    flashButtonError(button);
  }
}

const inviteTokenFromUrl = new URLSearchParams(location.search).get("invite");
let anonymousSignInAttempted = false;

onAuthStateChanged(auth, async user => {
  appState.currentUser = user;
  appState.isAdmin = Boolean(user && !user.isAnonymous && String(user.email || "").toLowerCase() === ADMIN_EMAIL);
  updateHeaderForUser(user);

  /* ---------- Student link ---------- */
  if (inviteTokenFromUrl) {
    if (!user) {
      if (anonymousSignInAttempted) return;
      anonymousSignInAttempted = true;
      try {
        await signInAnonymously(auth);       // triggers this listener again with a user
      } catch (anonymousError) {
        console.error("[VoiceCheck] Anonymous sign-in failed:", anonymousError);
        renderStudentError("We couldn't start your Voice Check",
          "Please refresh the page. (Tell Mr Chung: Anonymous sign-in may be switched off in Firebase.)");
      }
      return;
    }
    if (appState.mode !== "student") {
      if (appState.isAdmin) await loadSettings();   // admin previewing a student link keeps correct email links
      startStudentMode(inviteTokenFromUrl);
    }
    return;
  }

  /* ---------- Dashboard ---------- */
  if (appState.isAdmin) {
    if (appState.mode !== "admin") startAdminMode();
    return;
  }
  stopAdminListeners();
  if (user && !user.isAnonymous) {
    renderSignInScreen("You're signed in as " + user.email + ", which isn't the Polymath admin account. Students: please use the link in your email.");
  } else {
    renderSignInScreen("");
  }
});
